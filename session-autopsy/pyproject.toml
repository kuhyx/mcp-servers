[project]
name = "session-autopsy"
version = "0.2.0"
description = "Zero-token analyzer for Claude Code transcripts: finds automation candidates and prices wasted API turns."
requires-python = ">=3.14"
# No third-party runtime dependencies: `Self` is in the stdlib from 3.11,
# which is this package's floor anyway.
dependencies = []

[project.scripts]
session-autopsy = "session_autopsy.cli:main"

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-cov==7.1.0", "ruff==0.16.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["session_autopsy"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["session_autopsy/tests"]

[tool.coverage.run]
branch = true
source = ["session_autopsy"]

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_lines = ["if __name__ == .__main__.:", "pragma: no cover", "\\.\\.\\."]

[project]
name = "session-autopsy"
version = "0.2.0"
description = "Zero-token analyzer for Claude Code transcripts: finds automation candidates and prices wasted API turns."
requires-python = ">=3.11"
dependencies = ["typing_extensions>=4.0"]

[project.scripts]
session-autopsy = "session_autopsy.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["session_autopsy"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["session_autopsy/tests"]

[tool.coverage.run]
branch = true
source = ["session_autopsy"]

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_lines = ["if __name__ == .__main__.:", "pragma: no cover", "\\.\\.\\."]

name: file-length

# The 250-line cap, enforced on push as well as at commit time. The local
# pre-commit hook can be skipped (a fresh clone that never ran
# `pre-commit install` has no hooks), so the cap needs a gate nobody can forget.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  file-length:
    name: file length <= 250 lines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The cap and exemption list live in the shared utils repo so every repo
      # enforces the same rule.
      - name: Check out the shared gate
        uses: actions/checkout@v4
        with:
          repository: kuhyx/utils
          path: .utils

      - name: Enforce the 250-line cap
        run: bash .utils/scripts/check_file_length.sh --all
